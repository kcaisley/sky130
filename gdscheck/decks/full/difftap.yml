# Diffusion and tap (difftap.1-3).
rules:
  - id: difftap.1
    check: min_width
    layers: [diff]
    value: 0.15
  - id: difftap.1
    check: min_width
    layers: [tap]
    value: 0.15
  - id: difftap.3
    check: min_space
    layers: [difftap]
    value: 0.27
  - id: difftap.3
    check: min_notch
    layers: [difftap]
    value: 0.27
