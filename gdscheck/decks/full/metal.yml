# Metals met1-met5: width, space, area (m1.1/2/6 ... m5.1/2/4); areas 1e-6 um2 below the
# rule (gdscheck compares them in floating point).
rules:
  - id: m1.1
    check: min_width
    layers: [met1]
    value: 0.14
  - id: m1.2
    check: min_space
    layers: [met1]
    value: 0.14
  - id: m1.2
    check: min_notch
    layers: [met1]
    value: 0.14
  - id: m1.area
    check: min_area
    layers: [met1]
    value: 0.082999
  - id: m2.1
    check: min_width
    layers: [met2]
    value: 0.14
  - id: m2.2
    check: min_space
    layers: [met2]
    value: 0.14
  - id: m2.2
    check: min_notch
    layers: [met2]
    value: 0.14
  - id: m2.area
    check: min_area
    layers: [met2]
    value: 0.067599
  - id: m3.1
    check: min_width
    layers: [met3]
    value: 0.3
  - id: m3.2
    check: min_space
    layers: [met3]
    value: 0.3
  - id: m3.2
    check: min_notch
    layers: [met3]
    value: 0.3
  - id: m3.area
    check: min_area
    layers: [met3]
    value: 0.239999
  - id: m4.1
    check: min_width
    layers: [met4]
    value: 0.3
  - id: m4.2
    check: min_space
    layers: [met4]
    value: 0.3
  - id: m4.2
    check: min_notch
    layers: [met4]
    value: 0.3
  - id: m4.area
    check: min_area
    layers: [met4]
    value: 0.239999
  - id: m5.1
    check: min_width
    layers: [met5]
    value: 1.6
  - id: m5.2
    check: min_space
    layers: [met5]
    value: 1.6
  - id: m5.2
    check: min_notch
    layers: [met5]
    value: 1.6
